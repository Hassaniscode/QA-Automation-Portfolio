name: Playwright Tests

on:
  push:
    branches: [main]
    paths:
      - 'playwright-ts/**'
      - '.github/workflows/playwright.yml'
  pull_request:
    branches: [main]
    paths:
      - 'playwright-ts/**'
      - '.github/workflows/playwright.yml'

jobs:
  playwright:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playwright-ts

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: playwright-ts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run E2E tests
        run: npx playwright test --project=chromium --project=firefox --project=webkit

      - name: Run API tests
        run: npx playwright test --project=api

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-ts/playwright-report/
          retention-days: 7

      - name: Upload traces, screenshots, and videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: playwright-ts/test-results/
          retention-days: 7
