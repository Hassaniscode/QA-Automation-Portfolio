name: Selenium Tests

on:
  push:
    branches: [main]
    paths:
      - 'selenium-java/**'
      - '.github/workflows/selenium.yml'
  pull_request:
    branches: [main]
    paths:
      - 'selenium-java/**'
      - '.github/workflows/selenium.yml'

jobs:
  selenium:
    name: Run Selenium Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: selenium-java

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run E2E and API tests
        run: mvn test

      - name: Upload Surefire reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: selenium-java/target/surefire-reports/
          retention-days: 7

      - name: Upload failure screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-screenshots
          path: selenium-java/target/screenshots/
          retention-days: 7
